name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release-please
    runs-on: ${{ github.event.repository.private && (vars.RUNNER || 'self-hosted') || 'ubuntu-latest' }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - if: steps.rp.outputs.release_created
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.rp.outputs.tag_name }}
      - name: upload the release files
        if: steps.rp.outputs.release_created
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: |
          bash scripts/package.sh "${TAG#v}" "$RUNNER_TEMP/dist"
          gh release upload "$TAG" "$RUNNER_TEMP"/dist/* --clobber
