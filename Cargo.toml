[package]
name = "mayfly"
version = "0.7.0"
edition = "2021"
description = "Throwaway GitHub Actions runners on Proxmox VE"
license = "MIT"
repository = "https://github.com/Variiuz/mayfly"
publish = false

[dependencies]
flate2 = "1"
jsonwebtoken = "9"
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[profile.release]
panic = "abort"
strip = true
lto = true
